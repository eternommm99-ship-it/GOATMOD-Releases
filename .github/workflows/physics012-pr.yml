name: GOATMOD Physics 0.12 PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'physics012/**'
      - '.github/workflows/physics012-pr.yml'

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S physics012 -B physics012/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build physics012/build --config Release --parallel
      - name: Test
        run: ctest --test-dir physics012/build --output-on-failure
